name: Integration tests

# Integration tests against disposable infrastructure — nightly, on demand, and
# on PRs to dev via the Tests workflow (workflow_call, after unit tests pass).
#
# The whole suite needs one service: MongoDB. Every test creates its own
# throwaway database from the production validators and drops it on teardown
# (see tests/conftest.py), so the container needs no seeding — but it does need
# a root user: the validator migrations use `collMod`, which requires `dbAdmin`.
# Without TEST_MONGO_URL the suite self-skips, so the URL below is what makes
# these tests actually run in CI.

on:
  workflow_dispatch:
  workflow_call:
  schedule:
    - cron: "31 3 * * *"

# The app builds its service-auth client at import time and fails without these.
env:
  SERVICE_AUTH_SERVER_URL: http://localhost:9999
  SERVICE_AUTH_REALM: test
  SERVICE_AUTH_CLIENT_ID: test-client
  SERVICE_AUTH_CLIENT_SECRET: test-secret

jobs:
  integration:
    name: Integration (MongoDB)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      mongo:
        image: mongo:8.2
        env:
          MONGO_INITDB_ROOT_USERNAME: admin
          MONGO_INITDB_ROOT_PASSWORD: admin
        ports:
          - 27017:27017

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync

      - name: Wait for MongoDB
        run: |
          for i in $(seq 1 30); do
            if bash -c '</dev/tcp/localhost/27017' 2>/dev/null; then echo "MongoDB is up."; break; fi
            sleep 2
          done
          bash -c '</dev/tcp/localhost/27017'

      - name: Run integration tests
        env:
          TEST_MONGO_URL: mongodb://admin:admin@localhost:27017/?authSource=admin
        run: uv run pytest tests/integration -m integration -rs
