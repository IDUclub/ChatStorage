[project]
name = "chatstorage"
version = "0.2.0"
description = "Add your description here"
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.14.1",
    "cachetools>=7.1.4",
    "dotenv>=0.9.9",
    "fastapi>=0.138.1",
    "fastmcp>=3.4.2",
    "loguru>=0.7.3",
    "pymongo>=4.17.0",
    "python-jose[cryptography]>=3.5.0",
    "starlette>=1.3.1",
    "tenacity>=9.1.4",
    "uvicorn>=0.49.0",
    "dotenv>=0.9.9",
]

[dependency-groups]
dev = [
    "pre-commit>=4.6.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[tool.uv]
# Transitive packages pinned below their next major to stay within the "minor/patch only"
# upgrade policy (deps-update sweep); none of these are direct dependencies of this project.
override-dependencies = [
    "cryptography<48",
    "importlib-metadata<9",
    "rich-rst<2",
    "websockets<17",
    "zipp<4",
    "rpds-py<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
markers = [
    "integration: tests that require a live MongoDB (set TEST_MONGO_URL)",
]
