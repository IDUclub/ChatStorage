# Docker keeps at most 5 files of 20 MB (100 MB) of stdout/stderr per container.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:
  chat_storage:
    logging: *default-logging
    build:
      context: .
      dockerfile: Dockerfile
    container_name: chat_storage
    env_file:
      - .env.example
    ports:
      - "8010:8000"
    restart: unless-stopped
    networks:
      localnet:
        aliases:
          - chat_storage

  mongo:
    logging: *default-logging
    image: mongo:8.0.21-rc1-noble
    container_name: mongo_db
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin
      MONGO_INITDB_DATABASE: chat_history
    ports:
      - "27017:27017"
    volumes:
      - ./mongo/data:/data/db
      - ./mongo/init:/docker-entrypoint-initdb.d:ro
    networks:
      - localnet

networks:
  localnet:
    external: true
